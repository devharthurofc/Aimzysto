<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMZY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#f5f0ee;font-family:'Chakra Petch',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(239,68,68,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(239,68,68,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at center,#000 10%,transparent 72%);pointer-events:none}
body::after{content:"";position:fixed;width:460px;height:460px;border-radius:50%;background:#dc2626;filter:blur(170px);opacity:.13;top:50%;left:50%;transform:translate(-50%,-50%);z-index:-2}
.scene{position:relative;width:min(620px,100%);display:grid;place-items:center}
.orbit{position:absolute;width:clamp(390px,82vw,600px);height:clamp(390px,82vw,600px);border:1px solid rgba(239,68,68,.14);border-radius:50%;animation:spin 22s linear infinite;pointer-events:none}
.orbit::before,.orbit::after{content:"";position:absolute;inset:11%;border:1px dashed rgba(248,113,113,.12);border-radius:50%}
.orbit::after{inset:24%;border-style:solid;opacity:.7}
.weapon{position:absolute;left:50%;top:50%;width:86px;height:34px;color:#ef4444;filter:drop-shadow(0 0 9px rgba(239,68,68,.55));transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(clamp(195px,41vw,300px)));animation:weaponPulse 2.8s ease-in-out infinite;animation-delay:var(--delay)}
.weapon svg{width:100%;height:100%;overflow:visible}
.weapon:nth-child(2n){color:#f87171;opacity:.72}
.weapon:nth-child(3n){color:#b91c1c;opacity:.6}
.box{position:relative;z-index:2;width:min(390px,100%);border:1px solid rgba(248,113,113,.25);border-radius:22px;background:linear-gradient(145deg,rgba(31,12,16,.92),rgba(10,10,14,.94));padding:32px 28px;text-align:center;backdrop-filter:blur(16px);box-shadow:0 24px 80px rgba(0,0,0,.58),0 0 42px rgba(220,38,38,.14);animation:panelIn .7s cubic-bezier(.22,1,.36,1) both}
.mark{width:52px;height:52px;border-radius:15px;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(135deg,#7f1d1d,#ef4444);box-shadow:0 0 30px rgba(220,38,38,.5)}
.mark svg{width:27px;height:27px}
h1{font-family:'Russo One',sans-serif;font-size:1.25rem;font-weight:400}
h1 span{background:linear-gradient(90deg,#dc2626,#f87171);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#a89f9c;font-size:.9rem;margin:6px 0 22px}
label{display:block;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#a89f9c;margin:12px 0 6px}
input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:11px;color:#f5f0ee;padding:12px 13px;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:.98rem;outline:none;transition:.2s}
input:focus{border-color:#ef4444;box-shadow:0 0 14px rgba(239,68,68,.3)}
button{margin-top:20px;width:100%;appearance:none;border:none;cursor:pointer;font-family:'Russo One',sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;padding:14px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#7f1d1d,#dc2626);box-shadow:0 8px 24px rgba(220,38,38,.35);transition:.2s}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:12px;font-weight:700;font-size:.9rem;color:#fca5a5;display:none}
.msg.show{display:block}
.home{display:inline-block;margin-top:18px;color:#f87171;text-decoration:none;font-weight:700}
.home:hover{text-decoration:underline}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes weaponPulse{0%,100%{filter:drop-shadow(0 0 6px rgba(239,68,68,.35));opacity:.48}50%{filter:drop-shadow(0 0 16px rgba(248,113,113,.9));opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.orbit,.weapon,.box{animation:none}}
</style>
</head>
<body>
<div class="scene">
  <div class="orbit" aria-hidden="true">
    <span class="weapon" style="--angle:0deg;--delay:0s"><svg viewBox="0 0 100 40" fill="currentColor"><path d="M8 17h45l10-7h19v6h10v8H75l-8-5H53v7H42v-7H28l-6 8H13l4-8H8zM59 13h12v5H59z"/></svg></span>
    <span class="weapon" style="--angle:60deg;--delay:-.4s"><svg viewBox="0 0 100 40" fill="currentColor"><path d="M8 17h45l10-7h19v6h10v8H75l-8-5H53v7H42v-7H28l-6 8H13l4-8H8zM59 13h12v5H59z"/></svg></span>
    <span class="weapon" style="--angle:120deg;--delay:-.8s"><svg viewBox="0 0 100 40" fill="currentColor"><path d="M8 17h45l10-7h19v6h10v8H75l-8-5H53v7H42v-7H28l-6 8H13l4-8H8zM59 13h12v5H59z"/></svg></span>
    <span class="weapon" style="--angle:180deg;--delay:-1.2s"><svg viewBox="0 0 100 40" fill="currentColor"><path d="M8 17h45l10-7h19v6h10v8H75l-8-5H53v7H42v-7H28l-6 8H13l4-8H8zM59 13h12v5H59z"/></svg></span>
    <span class="weapon" style="--angle:240deg;--delay:-1.6s"><svg viewBox="0 0 100 40" fill="currentColor"><path d="M8 17h45l10-7h19v6h10v8H75l-8-5H53v7H42v-7H28l-6 8H13l4-8H8zM59 13h12v5H59z"/></svg></span>
    <span class="weapon" style="--angle:300deg;--delay:-2s"><svg viewBox="0 0 100 40" fill="currentColor"><path d="M8 17h45l10-7h19v6h10v8H75l-8-5H53v7H42v-7H28l-6 8H13l4-8H8zM59 13h12v5H59z"/></svg></span>
  </div>
  <div class="box">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
  </div>
  <h1>AIMZY<span>admin</span></h1>
  <p>Acesso restrito à equipe autorizada.</p>
  <label>Usuário</label>
  <input id="u" autocomplete="username">
  <label>Senha</label>
  <input id="p" type="password" autocomplete="current-password">
  <button id="b">Entrar</button>
  <div class="msg" id="m"></div>
  <a class="home" href="/">← Voltar ao site</a>
  </div>
</div>
<script src="/admin-login.js"></script>
</body>
</html>
